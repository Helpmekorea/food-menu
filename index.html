<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? - 메뉴 선택</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --primary: #f97316;
            --primary-hover: #ea580c;
            --badge-bg: #fff7ed;
            --badge-text: #c2410c;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .dark {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --primary: #f97316;
            --primary-hover: #ea580c;
            --badge-bg: #431407;
            --badge-text: #fdba74;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            transition: background-color 0.2s, color 0.2s;
            padding-bottom: 120px;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem;
            box-shadow: var(--shadow);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .controls {
            display: flex;
            gap: 0.55rem;
            align-items: center;
        }

        .btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.8rem;
            border-radius: 0.5rem;
            cursor: pointer;
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: var(--border-color);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* 검색 및 필터 영역 */
        .search-filter-box {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .categories, .tags {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar, .tags::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-chip.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .main-container {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.25rem;
        }

        .menu-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .menu-card:hover {
            transform: translateY(-3px);
        }

        .menu-img-area {
            width: 100%;
            height: 160px;
            background-color: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            position: relative;
            overflow: hidden;
        }

        .menu-img-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .menu-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 0.5rem;
        }

        .menu-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .menu-name {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .menu-price {
            font-weight: 800;
            color: var(--primary);
        }

        .menu-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            flex-grow: 1;
        }

        .menu-tags {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            background-color: var(--badge-bg);
            color: var(--badge-text);
        }

        .card-footer {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-color);
            display: flex;
            justify-content: flex-end;
        }

        /* 하단 주문 바 */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 1rem;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 99;
        }

        .cart-info {
            font-size: 1rem;
            font-weight: 700;
        }

        /* 모달 레이아웃 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 1rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .qty-btn {
            background: var(--border-color);
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-color);
        }

        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            background-color: var(--bg-color);
            color: var(--text-color);
            resize: none;
            height: 80px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="header-top">
                <h1>🍽️ 오늘 뭐 먹지?</h1>
                <div class="controls">
                    <button class="btn" id="regionBtn" onclick="toggleRegion()">📍 서울 평균</button>
                    <button class="btn btn-primary" onclick="randomPick()">🎲 아무거나</button>
                    <button class="btn" onclick="toggleDarkMode()">🌓</button>
                </div>
            </div>
            
            <div class="search-filter-box">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 먹고 싶은 메뉴나 태그를 검색해보세요 (예: 매운, 김치, 고기...)" oninput="filterMenus()">
                
                <div class="categories" id="categoryContainer">
                    <button class="filter-chip active" onclick="selectCategory('전체', this)">전체</button>
                    <button class="filter-chip" onclick="selectCategory('한식', this)">한식</button>
                    <button class="filter-chip" onclick="selectCategory('분식', this)">분식</button>
                    <button class="filter-chip" onclick="selectCategory('중식', this)">중식</button>
                    <button class="filter-chip" onclick="selectCategory('일식', this)">일식</button>
                    <button class="filter-chip" onclick="selectCategory('양식', this)">양식</button>
                    <button class="filter-chip" onclick="selectCategory('치킨', this)">치킨</button>
                    <button class="filter-chip" onclick="selectCategory('고기구이', this)">고기구이</button>
                    <button class="filter-chip" onclick="selectCategory('아시안', this)">아시안</button>
                    <button class="filter-chip" onclick="selectCategory('음료', this)">음료</button>
                    <button class="filter-chip" onclick="selectCategory('디저트', this)">디저트</button>
                </div>

                <div class="tags" id="tagContainer">
                    <button class="filter-chip active" onclick="selectTag('전체', this)">#태그전체</button>
                    <button class="filter-chip" onclick="selectTag('매운맛', this)">#매운맛</button>
                    <button class="filter-chip" onclick="selectTag('든든한', this)">#든든한</button>
                    <button class="filter-chip" onclick="selectTag('간단한', this)">#간단한</button>
                    <button class="filter-chip" onclick="selectTag('시원한', this)">#시원한</button>
                    <button class="filter-chip" onclick="selectTag('달콤한', this)">#달콤한</button>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="menu-grid" id="menuGrid"></div>
    </main>

    <!-- 하단 장바구니 바 -->
    <div class="cart-bar" id="cartBar" style="display:none;">
        <div class="cart-info" id="cartSummaryText">0개 선택됨 (0원)</div>
        <button class="btn btn-primary" onclick="openCartModal()">주문하기</button>
    </div>

    <!-- 주문 상세 모달 -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <h2>🛒 주문서 확인</h2>
            <div id="cartItemsList"></div>
            <div>
                <label style="font-size: 0.9rem; font-weight: 600; margin-bottom: 0.3rem; display: block;">요청사항</label>
                <textarea id="orderRequest" placeholder="요청사항을 입력해주세요 (예: 매운맛 덜하게 해주세요)"></textarea>
            </div>
            <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem;">
                <button class="btn" onclick="closeCartModal()">닫기</button>
                <button class="btn btn-primary" onclick="completeOrder()">주문 완료</button>
            </div>
        </div>
    </div>
